<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Hsieh | 個人常用連結門戶</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-primary: #f4f6f9;
            --bg-secondary: #ffffff;
            --border-color: rgba(44, 62, 80, 0.1);
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --accent-terracotta: #8e6e66;
            --accent-slate: #2c3e50;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            background: linear-gradient(135deg, #f4f6f9 0%, #e9eff4 100%);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .portal-container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .portal-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent-terracotta), var(--accent-slate));
        }

        .profile-area {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-terracotta);
            box-shadow: 0 4px 15px rgba(142, 110, 102, 0.25);
            transition: var(--transition);
        }

        .profile-img:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(142, 110, 102, 0.35);
        }

        .profile-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-slate);
            margin-top: 15px;
            margin-bottom: 6px;
        }

        .profile-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-terracotta);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .profile-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 420px;
            margin: 0 auto;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 30px;
        }

        .portal-link-card {
            display: flex;
            align-items: center;
            text-decoration: none;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 24px;
            transition: var(--transition);
            color: var(--text-primary);
            position: relative;
        }

        .portal-link-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-terracotta);
            background: rgba(142, 110, 102, 0.04);
            box-shadow: 0 6px 15px rgba(142, 110, 102, 0.08);
        }

        .card-icon {
            font-size: 24px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(44, 62, 80, 0.06);
            color: var(--accent-slate);
            margin-right: 18px;
            transition: var(--transition);
        }

        .portal-link-card:hover .card-icon {
            background: var(--accent-terracotta);
            color: #ffffff;
        }

        .card-text {
            text-align: left;
            flex-grow: 1;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-slate);
            margin-bottom: 4px;
        }

        .portal-link-card:hover .card-title {
            color: var(--accent-terracotta);
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-arrow {
            font-size: 16px;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .portal-link-card:hover .card-arrow {
            transform: translateX(4px);
            color: var(--accent-terracotta);
        }

        /* Social icons at bottom */
        .portal-socials {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 35px;
        }

        .social-link {
            font-size: 18px;
            color: var(--accent-slate);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-decoration: none;
        }

        .social-link:hover {
            background: var(--accent-terracotta);
            color: #ffffff;
            border-color: var(--accent-terracotta);
            transform: translateY(-3px);
        }

        .portal-footer {
            margin-top: 35px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Mobile adaptation */
        @media (max-width: 576px) {
            .portal-container {
                padding: 30px 20px;
                border-radius: 16px;
            }
            .profile-img {
                width: 90px;
                height: 90px;
            }
            .profile-name {
                font-size: 20px;
            }
            .portal-link-card {
                padding: 14px 16px;
            }
            .card-icon {
                width: 38px;
                height: 38px;
                font-size: 20px;
                margin-right: 14px;
            }
            .card-title {
                font-size: 14px;
            }
            .card-subtitle {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="profile-area">
            <img src="assets/img/profile.jpeg" alt="Brian Hsieh" class="profile-img">
            <h2 class="profile-name">謝進權 Brian</h2>
            <div class="profile-title">臺北科技大學 電子工程系</div>
            <p class="profile-desc">專注於人工智慧 (AI) 應用、資訊安全、軟體開發與數據分析。這是我的個人常用工具及作品專欄入口導覽。</p>
        </div>

        <div class="links-grid">
            <!-- Link 1: Immersive English Learning Tracker -->
            <a href="english-learning/index.html" class="portal-link-card">
                <div class="card-icon"><i class="fas fa-language"></i></div>
                <div class="card-text">
                    <div class="card-title">英文沉浸式學習紀錄器</div>
                    <div class="card-subtitle">記錄每日 1hr 輸入 + 1hr 輸出之聽讀口說進度</div>
                </div>
                <div class="card-arrow"><i class="fas fa-chevron-right"></i></div>
            </a>

            <!-- Link 2: Resume & Portfolio -->
            <a href="./resume.html" class="portal-link-card">
                <div class="card-icon"><i class="fas fa-file-invoice"></i></div>
                <div class="card-text">
                    <div class="card-title">個人簡歷與專案作品集</div>
                    <div class="card-subtitle">我的學經歷、核心技能與網誌式專題專欄介紹</div>
                </div>
                <div class="card-arrow"><i class="fas fa-chevron-right"></i></div>
            </a>

            <!-- Link 3: WuLing KOM Certificate website -->
            <a href="https://brianchuan.github.io/WuLing-KOM-certificate/" target="_blank" class="portal-link-card">
                <div class="card-icon"><i class="fas fa-certificate"></i></div>
                <div class="card-text">
                    <div class="card-title">武嶺登頂證書產生器</div>
                    <div class="card-subtitle">個人興趣 Side Project：自行車登頂證書自動生成下載</div>
                </div>
                <div class="card-arrow"><i class="fas fa-chevron-right"></i></div>
            </a>
        </div>

        <div class="portal-socials">
            <a href="https://github.com/BrianChuan" target="_blank" class="social-link" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/brian-hsieh0103/" target="_blank" class="social-link" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="mailto:0103.brian@gmail.com" class="social-link" title="Email"><i class="far fa-envelope"></i></a>
        </div>

        <div class="portal-footer">
            &copy; 2026 Brian Hsieh. Managed Privately.
        </div>
    </div>

</body>
</html>
